services:
  camp:
    image: ${IMAGE:-camp-gallery:latest}
    restart: unless-stopped
    stop_grace_period: 35s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: "1.5"
    pids_limit: 128
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?请设置 PUBLIC_BASE_URL}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      UPLOAD_DEADLINE: ${UPLOAD_DEADLINE:-2026-11-19T23:59:59+08:00}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      ACTIVITY_TITLE: ${ACTIVITY_TITLE:-心纹研学营}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-8}
      MAX_QUEUED_UPLOADS: ${MAX_QUEUED_UPLOADS:-128}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-512}
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-7200}
      UPLOAD_BANDWIDTH_MBPS: ${UPLOAD_BANDWIDTH_MBPS:-90}
      DOWNLOAD_BANDWIDTH_MBPS: ${DOWNLOAD_BANDWIDTH_MBPS:-80}
      GOMEMLIMIT: ${GOMEMLIMIT:-512MiB}
    volumes:
      - camp-data:/data
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - camp
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    command:
      - reverse-proxy
      - --from
      - ${SITE_ADDRESS}
      - --to
      - camp:8000
    volumes:
      - caddy-data:/data
      - caddy-config:/config
volumes:
  camp-data:
  caddy-data:
  caddy-config:
